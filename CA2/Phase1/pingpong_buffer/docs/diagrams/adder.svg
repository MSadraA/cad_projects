<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#287AA6"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#203441">
<rect x="220" y="18" width="460" height="65" rx="9" fill="#EEF5F8" stroke="#287AA6" stroke-width="1.7"/>
<text x="450.0" y="45.5" text-anchor="middle" font-size="18" font-weight="bold">Unpack / classify inputs</text>
<text x="450.0" y="70.5" text-anchor="middle" font-size="14">s[15], e[14:10], f[9:0]</text>
