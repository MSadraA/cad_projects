<rect x="475" y="402" width="365" height="65" rx="9" fill="#EEF5F8" stroke="#287AA6" stroke-width="1.7"/>
<text x="657.5" y="429.5" text-anchor="middle" font-size="18" font-weight="bold">Carry normalization</text>
<text x="657.5" y="454.5" text-anchor="middle" font-size="14">fraction = sum[12:3]; exponent + 1</text>
<rect x="220" y="512" width="460" height="65" rx="9" fill="#EEF5F8" stroke="#287AA6" stroke-width="1.7"/>
<text x="450.0" y="539.5" text-anchor="middle" font-size="18" font-weight="bold">Truncate + exponent checks</text>
<text x="450.0" y="564.5" text-anchor="middle" font-size="14">zero / underflow / overflow / input bypass</text>
<text x="450" y="627" font-size="20" text-anchor="middle">result[15:0]</text>
