<rect x="220" y="206" width="460" height="65" rx="9" fill="#EEF5F8" stroke="#287AA6" stroke-width="1.7"/>
<text x="450.0" y="233.5" text-anchor="middle" font-size="18" font-weight="bold">Align smaller significand</text>
<text x="450.0" y="258.5" text-anchor="middle" font-size="14">13-bit shift-right-jam; delta exponent</text>
<rect x="220" y="300" width="460" height="65" rx="9" fill="#EEF5F8" stroke="#287AA6" stroke-width="1.7"/>
<text x="450.0" y="327.5" text-anchor="middle" font-size="18" font-weight="bold">Shared ADD / SUB carry chain</text>
<text x="450.0" y="352.5" text-anchor="middle" font-size="14">specialized low zeros and high hidden-one</text>
<rect x="60" y="402" width="365" height="65" rx="9" fill="#EEF5F8" stroke="#287AA6" stroke-width="1.7"/>
<text x="242.5" y="429.5" text-anchor="middle" font-size="18" font-weight="bold">Normalize sum</text>
